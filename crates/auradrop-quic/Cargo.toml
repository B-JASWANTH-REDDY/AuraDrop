[package]
name = "auradrop-quic"
version = "0.1.0"
edition = "2021"
authors = ["AuraDrop Team"]
description = "AuraDrop High-Performance QUIC Data Plane Engine"

[lib]
name = "auradrop_quic"
crate-type = ["cdylib", "rlib"]

[dependencies]
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", features = ["ring"] }
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "net", "sync", "time", "io-util", "fs", "macros"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
uuid = { version = "1.12", features = ["v4"] }
once_cell = "1.20"
jni = { version = "0.21", default-features = false }

[dev-dependencies]
tempfile = "3.16"
